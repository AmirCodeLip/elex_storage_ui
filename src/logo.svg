<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f0f8ff" />
            <stop offset="100%" stop-color="#d1e8ff" />
        </linearGradient>

        <linearGradient id="rainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4a90e2" />
            <stop offset="100%" stop-color="#1c6bb8" />
        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
            <feOffset dx="2" dy="2" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Cloud -->
    <g filter="url(#softShadow)">
        <!-- Main cloud body -->
        <ellipse cx="100" cy="80" rx="50" ry="30" fill="url(#cloudGradient)" />

        <!-- Cloud puffs -->
        <circle cx="75" cy="70" r="20" fill="url(#cloudGradient)" />
        <circle cx="125" cy="70" r="20" fill="url(#cloudGradient)" />
        <circle cx="90" cy="60" r="18" fill="url(#cloudGradient)" />
        <circle cx="110" cy="60" r="18" fill="url(#cloudGradient)" />
        <circle cx="100" cy="65" r="22" fill="url(#cloudGradient)" />
    </g>

    <!-- Raindrops -->
    <g>
        <!-- Left drop -->
        <path d="M85,95 Q85,100 80,105 Q85,110 85,115 L87,115 Q87,110 92,105 Q87,100 87,95 Z"
            fill="url(#rainGradient)" />

        <!-- Middle drop -->
        <path
            d="M100,95 Q100,100 95,105 Q100,110 100,115 L102,115 Q102,110 107,105 Q102,100 102,95 Z"
            fill="url(#rainGradient)" />

        <!-- Right drop -->
        <path
            d="M115,95 Q115,100 110,105 Q115,110 115,115 L117,115 Q117,110 122,105 Q117,100 117,95 Z"
            fill="url(#rainGradient)" />
    </g>

    <!-- Optional: Simple rain lines (alternative style) -->
    <!--
    <g stroke="url(#rainGradient)" stroke-width="2" stroke-linecap="round">
        <line x1="85" y1="100" x2="85" y2="120" />
        <line x1="100" y1="100" x2="100" y2="120" />
        <line x1="115" y1="100" x2="115" y2="120" />
    </g>
    -->
</svg>